<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - MAY HOTEL</title>
    <!-- Use login.css since it shares the same design system -->
    <link rel="stylesheet" href="css/login.css" />

  <!-- CÁC FILE CSS ĐƯỢC CHÈN SẴN ĐỂ TRÁNH FOUC (FLASH OF UNSTYLED CONTENT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../style.css" />
  <style>
    .navbar-nav .nav-link.active-menu {
      font-weight: 700 !important;
      color: #d4af37 !important; /* Màu vàng Gold */
      background-color: rgba(212, 175, 55, 0.1); /* Nền mờ */
      border-radius: 8px; /* Bo tròn góc */
      padding: 8px 16px !important; /* Tạo khoảng trống xung quanh chữ */
      transition: 0.3s all ease-in-out;
    }
  </style>

</head>
<body>

    <div class="login-wrapper py-5 fade-in-box">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card card-login shadow-lg border-0">

                        <div class="card-header-login text-center py-4 bg-navy text-white" style="background-color: var(--navy-color);">
                            <h2 class="fw-bold text-white">Đăng ký thành viên</h2>
                            <p class="mb-0 small opacity-75">Tạo tài khoản để nhận nhiều ưu đãi từ MAY HOTEL</p>
                        </div>

                        <div class="card-body p-4 p-md-5">

                            <div id="error-message" class="alert alert-danger text-center mb-4" role="alert" style="display: none;">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span>Thông báo lỗi</span>
                            </div>

                            <form id="register-form">

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-navy">Tên đăng nhập <span class="text-danger">*</span></label>
                                    <input type="text" id="tenDangNhap" class="form-control" placeholder="Nhập tên đăng nhập" required />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-navy">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" id="matKhau" class="form-control" placeholder="Nhập mật khẩu" required />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-navy">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" id="hoTen" class="form-control" placeholder="Nhập họ và tên đầy đủ" required />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-navy">Email <span class="text-danger">*</span></label>
                                    <input type="email" id="email" class="form-control" placeholder="Nhập địa chỉ email của bạn" required />
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-navy">Số điện thoại</label>
                                        <input type="text" id="soDienThoai" class="form-control" placeholder="Nhập số điện thoại" />
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold text-navy">Quốc tịch</label>
                                        <input type="text" id="quocTich" class="form-control" placeholder="VD: Việt Nam" />
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-navy">Địa chỉ</label>
                                    <input type="text" id="diaChi" class="form-control" placeholder="Nhập địa chỉ của bạn" />
                                </div>

                                <button type="submit" id="btn-submit" class="btn w-100 py-3 fw-bold shadow-sm text-white" style="background-color: var(--gold-color); border: none;">
                                    <i class="bi bi-person-plus-fill me-2"></i> ĐĂNG KÝ NGAY
                                </button>
                            </form>

                            <div class="login-footer text-center mt-4">
                                <p class="mb-1">Đã có tài khoản? <a href="login.html" class="fw-bold" style="color: var(--navy-color);">Đăng nhập ngay</a></p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="../layout.js"></script>
<script src="../app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
